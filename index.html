<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f8;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        img {
            width: 200px;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        form {
            margin-top: 20px;
        }
        input, textarea {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>مرحبًا بك في موقعي الشخصي</h1>
    <p>أنا سعيد/ة بزيارتك! يمكنك معرفة المزيد عني أو التواصل معي من خلال النموذج أدناه.</p>
    
    <img src="https://via.placeholder.com/200" alt="صورة شخصية">
    
    <br><br>
    <button onclick="alert('شكرًا لزيارتك!')">اضغط هنا</button>

    <form>
        <h2>نموذج التواصل</h2>
        <input type="text" placeholder="الاسم" required><br>
        <input type="email" placeholder="البريد الإلكتروني" required><br>
        <textarea rows="5" placeholder="رسالتك"></textarea><br>
        <button type="submit">إرسال</button>
    </form>
</body>
</html>
